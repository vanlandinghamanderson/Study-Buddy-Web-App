{% extends 'base.html' %}
{% block title %}Register Your Account{% endblock %}

{% block content %}
<div class="card form-card">
    <h1>Register Your Account</h1>
    
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register')}}">
        <div class="form-group">
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" required autocomplete="first_name">
        </div>

        <div class="form-group">
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" required autocomplete="last_name">
        </div>

        <div class="form-group">
            <label for="degree_id">Degree:</label>
            <select id="degree_id" name="degree_id" required>
                <option value="">Select a degree...</option>
                {% for degree in all_degrees %}
                <option value="{{degree.id}}">{{ degree.type }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="major_id">Major:</label>
            <select id="major_id" name="major_id" required>
                <option value="">Select a major...</option>
                {% for major in all_majors %}
                <option value="{{major.id}}">{{ major.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="course_ids">Courses you're taking:</label>
            <select id="course_ids" name="course_ids" multiple size="6" required>
                {% for course in all_courses %}
                <option value="{{ course.id }}">{{ course.department }} {{ course.code }} - {{ course.name }}</option>
                {% endfor %}
            </select>
            <small>Hold Ctrl/Cmd to select multiple courses.</small>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <div class="password-wrap">
                <input type="password" id="password" name="password" required autocomplete="new-password">
                <button type="button" class="btn toggle-password" data-target="password">Show</button>
            </div>
        </div>

        <button type="submit" class="submit-btn">Register</button>
    </form>
</div>
{% endblock %}

{% block scripts %}

{% endblock %}
