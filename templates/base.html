<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{% block title %}{% endblock %}</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <style>
      .navbar_menu {
        list-style-type: none;
        align-items: center;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 10px; /*Pushes the links down from the top */
      }
      .navbar_menu li {
        position: relative;
        justify-content: center;
        
      }
      .navbar_menu a{
        text-decoration: none;
        color: white;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
      }
      .navbar_menu li a {
        font-weight: 500;
        padding: .5rem .85rem;
        text-align: center;
      }

      .navbar_menu li:hover a:hover {
        background-color: white;
        color: purple;
        border-radius: 10px;
      }
    </style>
  </head>


<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container navbar_inner">
          <a class="navbar-brand" href="#">
            <img src="static/images/studybuddies_logo.png" width="175" height="50" alt="">
          </a>
          <ul class="navbar_menu" id="nav-menu" role="list">
            <li>
              <a href="#">Home</a>
            </li>
            <li>
              <a href="#">Register</a>
            </li>
            <li>
              <a href="#">Login</a>
            </li>
            <li>
              <a href="#">My Dashboard</a>
            </li>
            <li>
              <a href="#">Find My Buddy</a>
            </li>
            <li>
              <a href="#">Find My Group</a>
            </li>
            <li>
              <a href="#">Log Out</a>
            </li>
          </ul>
        </div>
    </nav>

    <!-- Carousel -->
    <div id="carouselSlides" class="carousel slide" data-ride="carousel">

        <!-- Black overlay background -->
        <div class="carousel-overlay position-absolute top-0 start-0 w-100 h-100"></div>
        
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="d-block w-100" src="/static/images/ecu_campus_1.jpg" alt="First slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="/static/images/ecu_campus_2.jpg" alt="Second slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="/static/images/ecu_campus_3.jpg" alt="Third slide">
          </div>
        </div>

        {% block content %}{% endblock %}
    </div>


    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</html>
