<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{% block title %}{% endblock %}</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      .icon{
        display: flex;
      }

      /* The navigation bar*/
      @media (max-width: 1049px) {
        .nav {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          width: 100%;
          padding: 10px 0;
          gap: 0;
        }
        .nav.open {
          display: flex;
        }
        .navbar-brand {
          padding: 0;
        }
      }

      .nav li {
        display: flex;
      }
    </style>
  </head>


<body>

  <!-- Navigation Bar -->
   <header class="site-header" role="header">
    <nav class="navbar">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='images/pirate-flag.svg')}}" width="40" height="40" class="icon">
      </a>
      <ul class="nav justify-content-end" id="nav-menu" role="list">
        {% if session.get('student_id') %}
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('dashboard') }}">My Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('find_buddies') }}">Find a Buddy</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('find_groups') }}">Find a Group</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
        </li>
        {% else %}
        <li class="nav-item">
          <a class="nav-link active" href="{{ url_for('index')}}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('register') }}">Register</a>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="{{ url_for('login') }}">Login</a>
        </li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="{{ url_for('static', filename='js/index.js')}}"></script>
</body>
</html>
