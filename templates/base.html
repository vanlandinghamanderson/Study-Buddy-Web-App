<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{% block title %}{% endblock %}</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      .desktop-icon{
        display: flex;
      }
      .mobile-icon {
        display: none;
      }

      /* The navigation bar*/
      @media (max-width: 1049px) {
        .nav {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          width: 100%;
          padding: 10px 0;
          gap: 0;
        }
        .nav.open {
          display: flex;
        }
        .navbar-brand {
          padding: 0;
        }
        .desktop-logo {
          display: none;
        }
         .mobile-icon {
          display: flex;
        }
      }

      .nav li {
        display: flex;
      }
    </style>
  </head>


<body>

  <!-- Navigation Bar -->
   <header class="site-header" role="header">
    <nav class="navbar">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='images/studybuddies_logo.jpg')}}" width="180" height="50" class="desktop-logo">
        <img src="{{ url_for('static', filename='images/pirate-flag.svg')}}" width="40" height="40" class="mobile-icon">
      </a>
      <ul class="nav justify-content-end" id="nav-menu" role="list">
  
        <li class="nav-item">
          <a class="nav-link active" href="{{ url_for('index')}}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">My Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Find a Buddy</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Find a Group</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('register') }}">Register</a>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="{{ url_for('login') }}">Login</a>
        </li>
      </ul>
    </nav>
  </header>
    

    <!-- Carousel -->
    <div id="carouselSlides" class="carousel slide" data-ride="carousel">

        <!-- Black overlay background -->
        <div class="carousel-overlay position-absolute top-0 start-0 w-100 h-100"></div>
        
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="d-block w-100" src="/static/images/ecu_campus_1.jpg" alt="First slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="/static/images/ecu_campus_2.jpg" alt="Second slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="/static/images/ecu_campus_3.jpg" alt="Third slide">
          </div>
        </div>
        <div class="homepage-overlay">
          {% block content %}{% endblock %}
        </div>
    </div>
  </body>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="{{ url_for('static', filename='js/index.js')}}"></script>
</body>
</html>
